<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deepanath</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>deepanath</h1>
    <p>This page reads the project's Jenkinsfile and draws its pipeline.</p>
  </header>

  <main>
    <section aria-labelledby="stages-title">
      <div class="bar">
        <h2 id="stages-title">Pipeline stages</h2>
        <button id="run" type="button">Run pipeline</button>
      </div>
      <ol id="stages" class="stages"></ol>
      <p id="status" class="status" role="status">Ready. Press Run pipeline to simulate a build.</p>
    </section>

    <section aria-labelledby="src-title">
      <h2 id="src-title">Jenkinsfile</h2>
      <pre id="source" tabindex="0"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
